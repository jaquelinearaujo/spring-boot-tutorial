spring:
    application:
        name: spring-boot tutorial
    datasource:
        url: jdbc:postgresql://localhost:5432/spring-boot-tutorial
        username: postgres
        password: root
        driver-class-name: org.postgresql.Driver

    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: create-drop
        show-sql: true
        properties:
            hibernate:
                format_sql: true
